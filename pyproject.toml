[tool.ruff]
target-version = "py311"
line-length = 100
include = ["vela/**/*.py", "scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Entry points and isolated UI tests set paths/platforms before importing Qt.
"vela/ui.py" = ["E402"]
"vela/preview_runner.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
